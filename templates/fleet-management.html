<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakikaRide - Fleet Management</title>
    <link rel="stylesheet" href="/static/css/admin-dashboard.css">
    <link rel="stylesheet" href="/static/css/admin-dashboard-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="school-initial">H</div>
                    <div class="school-info">
                        <h2>HakikaRide</h2>
                        <span class="admin-email">admin@hakikaride.com</span>
                    </div>
                </div>
            </div>
            
            <ul class="nav-links">
                <li onclick="window.location.href='/admin/dashboard'">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </li>
                <li class="active" onclick="window.location.href='/admin/fleet'">
                    <i class="fas fa-bus"></i>
                    <span>Fleet Management</span>
                </li>
                <li onclick="window.location.href='/admin/students'">
                    <i class="fas fa-user-graduate"></i>
                    <span>Students</span>
                </li>
                <li onclick="window.location.href='/admin/drivers'">
                    <i class="fas fa-id-card"></i>
                    <span>Drivers</span>
                </li>
                <li>
                    <i class="fas fa-route"></i>
                    <span>Route Management</span>
                </li>
                <li onclick="window.location.href='/admin/drivers'">
                    <i class="fas fa-id-card"></i>
                    <span>Driver Management</span>
                </li>
                <li>
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="content-panel">
                <h1 class="dashboard-title">Fleet Management</h1>
                <div class="panel-content">
                    <div class="action-bar">
                        <button id="addBusBtn" class="btn-primary">
                            <i class="fas fa-plus"></i> Add New Bus
                        </button>
                    </div>

                    <div class="table-container">
                        <table id="busesTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>Number Plate</th>
                                    <th>Route</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="busesTableBody">
                                <!-- Buses will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Bus Modal -->
        <div id="busModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add New Bus</h2>
                <form id="busForm">
                    <input type="hidden" id="busId">
                    <div class="form-group">
                        <label for="numberPlate">Number Plate:</label>
                        <input type="text" id="numberPlate" name="numberPlate" required>
                    </div>
                    <div class="form-group">
                        <label for="routeId">Route:</label>
                        <input type="text" id="routeId" name="routeId" required>
                    </div>
                    <button type="submit" class="btn-primary" id="submitBusBtn">Add Bus</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="/static/js/fleet-management.js"></script>
</body>
</html>
