<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakikaRide - Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/admin-dashboard.css">
    <link rel="stylesheet" href="/static/css/admin-dashboard-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="school-initial">H</div>
                    <div class="school-info">
                        <h2>HakikaRide</h2>
                        <span class="admin-email">admin@hakikaride.com</span>
                    </div>
                </div>
            </div>
            
            <ul class="nav-links">
                <li class="active" data-panel="dashboard">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </li>
                <li data-panel="fleet">
                    <i class="fas fa-bus"></i>
                    <span>Fleet Management</span>
                </li>
                <li data-panel="students" onclick="window.location.href='/admin/students'">
                    <i class="fas fa-user-graduate"></i>
                    <span>Students</span>
                </li>
                <li data-panel="routes">
                    <i class="fas fa-route"></i>
                    <span>Route Management</span>
                </li>
                <li data-panel="drivers">
                    <i class="fas fa-id-card"></i>
                    <span>Driver Management</span>
                </li>
                <li data-panel="sign-out">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <div class="main-content">
            <h1 class="dashboard-title">School Dashboard</h1>
            <div class="quick-stats-card">
                <h2 class="quick-stats-title">Quick Stats</h2>
                <div class="stats-container">
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i class="fas fa-bus"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Active Buses</h3>
                            <p class="stat-number">{{.Stats.ActiveBuses}}</p>
                        </div>
                    </div>
                    
                    <div class="stat-divider"></div>
                    
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i class="fas fa-route"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Active Routes</h3>
                            <p class="stat-number">{{.Stats.ActiveRoutes}}</p>
                        </div>
                    </div>
                    
                    <div class="stat-divider"></div>
                    
                    <div class="stat-item">
                        <div class="stat-icon">
                            <i class="fas fa-user-graduate"></i>
                        </div>
                        <div class="stat-details">
                            <h3>Total Students</h3>
                            <p class="stat-number">{{.Stats.TotalStudents}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/your-font-awesome-kit.js"></script>
    
    <!-- Application Scripts -->
    <script src="/static/js/admin-dashboard-new.js"></script>
</body>
</html>
