<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HakikaRide - Driver Management</title>
    <link rel="stylesheet" href="/static/css/admin-dashboard.css">
    <link rel="stylesheet" href="/static/css/admin-dashboard-new.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="logo-container">
                    <div class="school-initial">H</div>
                    <div class="school-info">
                        <h2>HakikaRide</h2>
                        <span class="admin-email">admin@hakikaride.com</span>
                    </div>
                </div>
            </div>
            
            <ul class="nav-links">
                <li onclick="window.location.href='/admin/dashboard'">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </li>
                <li>
                    <i class="fas fa-bus"></i>
                    <span>Fleet Management</span>
                </li>
                <li onclick="window.location.href='/admin/students'">
                    <i class="fas fa-user-graduate"></i>
                    <span>Students</span>
                </li>
                <li>
                    <i class="fas fa-route"></i>
                    <span>Route Management</span>
                </li>
                <li class="active">
                    <i class="fas fa-id-card"></i>
                    <span>Driver Management</span>
                </li>
                <li>
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="content-panel">
                <h1 class="dashboard-title">Driver Management</h1>
                <div class="panel-content">
                    <div class="action-bar">
                        <button id="addDriverBtn" class="btn-primary">
                            <i class="fas fa-plus"></i> Add New Driver
                        </button>
                    </div>

                    <div class="table-container">
                        <table id="driversTable" class="data-table">
                            <thead>
                                <tr>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Phone Number</th>
                                    <th>Bus Number Plate</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="driversTableBody">
                                <!-- Drivers will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add/Edit Driver Modal -->
        <div id="driverModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add New Driver</h2>
                <form id="driverForm">
                    <input type="hidden" id="driverId">
                    <input type="hidden" id="userId">
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number:</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="busId">Bus Number Plate:</label>
                        <input type="text" id="busId" name="busId" required>
                    </div>
                    <button type="submit" class="btn-primary" id="submitDriverBtn">Add Driver</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="/static/js/driver-management.js?v=2"></script>
</body>
</html>
